#################
### AUTOSTART ###
#################

# Reapply the hardware lid state after startup and every config reload. Monitor
# rules can otherwise re-enable eDP while the lid remains closed.
exec = sleep 0.2 && ~/nixos/scripts/display/screen lid-sync

exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waypaper --backend awww --restore
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = blueman-applet
exec-once = nm-applet
exec-once = swaync
