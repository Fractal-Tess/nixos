# Hypridle configuration for Hyprland

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/nixos/scripts/display/screen on
}

# Timeline (both machines, both modes):
#   9m dim, 10m lock, 20m screen off, 30m suspend (laptop in normal mode only)

# Dim, as a one-minute warning before the lock
listener {
    timeout = 540
    on-timeout = ~/nixos/scripts/display/screen bright-set 10
    on-resume = ~/nixos/scripts/display/screen bright-set 100
}

# Lock
listener {
    timeout = 600
    on-timeout = ~/nixos/scripts/display/screen lock
}

# Screen off
listener {
    timeout = 1200
    on-timeout = ~/nixos/scripts/display/screen off
    on-resume = ~/nixos/scripts/display/screen on
}

# Suspend (laptops only, skipped while the waybar stay-awake toggle is on)
listener {
    timeout = 1800
    on-timeout = ~/nixos/scripts/display/screen idle-suspend
}
