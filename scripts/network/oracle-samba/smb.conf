# Samba on oracle (Ubuntu, not managed by the flake). Installed by ./setup.
# Same rules as modules/nixos/services/samba/share.nix: clients act as the
# real user and can never change the mode, owner or ACL of existing files.

[global]
	server string = oracle
	security = user
	passdb backend = tdbsam
	map to guest = never
	# Clients log in as fractal-tess (same credentials as the NixOS hosts);
	# the account here is ubuntu
	username map = /etc/samba/users.map

	# NetBird only (also enforced by iptables on wt0)
	hosts allow = 100.91.0.0/16 127.0.0.1
	hosts deny = 0.0.0.0/0 ::/0
	disable netbios = yes
	smb ports = 445

	server min protocol = SMB3
	smb3 unix extensions = no

	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	log file = /var/log/samba/log.%m
	max log size = 1000

[home]
	path = /home/ubuntu
	browseable = yes
	read only = no
	guest ok = no
	valid users = ubuntu
	nt acl support = no
	inherit acls = no
	store dos attributes = yes
	map archive = no
	map hidden = no
	map system = no
	map readonly = no
	dos filemode = no
	inherit permissions = yes
	follow symlinks = yes
	wide links = no
