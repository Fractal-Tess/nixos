# neo is a headless server: it stores and relays clipboard history for the
# other hosts but has no Wayland session to capture from.
[local]
mesh_key_file = "/run/secrets/clip_sync_mesh_key"
listen_port = 24892
reconcile_interval_seconds = 5
reconnect_min_seconds = 1
reconnect_max_seconds = 60
peer_interfaces = ["wt0"]
peer_addresses = ["100.91.0.2", "100.91.0.3", "100.91.126.8"]
inline_limit_bytes = 5242880
history_quota_bytes = 1073741824
clipboard = false
